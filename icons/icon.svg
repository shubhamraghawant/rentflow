<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="6" />

  <!-- House Outline (Rent) -->
  <path d="M 256 100 L 390 215 L 350 215 L 350 390 L 162 390 L 162 215 L 122 215 Z" fill="none" stroke="#60a5fa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" opacity="0.3" />

  <!-- Electricity Bolt (Light Bill) -->
  <path d="M 285 110 L 180 270 L 255 270 L 225 410 L 335 240 L 260 240 Z" fill="url(#bolt)" filter="url(#glow)" />
</svg>
